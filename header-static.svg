<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Manuel Ramos, Java Backend Developer">
  <title>Manuel Ramos - Java Backend Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111c36"/>
    </linearGradient>
    <linearGradient id="name" x1="48" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f89820"/>
      <stop offset="0.55" stop-color="#6db33f"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f89820"/>
      <stop offset="0.5" stop-color="#6db33f"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="round">
      <rect width="900" height="260" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#dots)"/>

    <rect width="6" height="260" fill="url(#accent)"/>

    <text x="48" y="62" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="14" fill="#6db33f">// backend engineer</text>

    <text x="48" y="124" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1" fill="url(#name)">Manuel Ramos</text>

    <text x="48" y="158" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="20" fill="#cbd5e1">Java Backend Developer</text>

    <text x="48" y="184" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#8b98ad">APIs, data and process automation that keep orders, stock and clients organized.</text>

    <g>
      <rect x="560" y="44" width="292" height="140" rx="10" fill="#0d1424" stroke="#243452"/>
      <g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13">
        <text x="578" y="76" fill="#6db33f">@RestController</text>
        <text x="578" y="100" fill="#e6edf3">public class Api {</text>
        <text x="578" y="124" fill="#38bdf8">  @GetMapping("/health")</text>
        <text x="578" y="148" fill="#a78bfa">  Health check() { ... }</text>
        <text x="578" y="172" fill="#e6edf3">}</text>
      </g>
    </g>

    <g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="12" text-anchor="middle">
      <rect x="48" y="206" width="56" height="24" rx="12" fill="#f89820" fill-opacity="0.12" stroke="#f89820" stroke-opacity="0.6"/>
      <text x="76" y="222" fill="#f89820">Java</text>

      <rect x="112" y="206" width="102" height="24" rx="12" fill="#6db33f" fill-opacity="0.12" stroke="#6db33f" stroke-opacity="0.6"/>
      <text x="163" y="222" fill="#6db33f">Spring Boot</text>

      <rect x="222" y="206" width="122" height="24" rx="12" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="283" y="222" fill="#34d399">Spring Security</text>

      <rect x="352" y="206" width="56" height="24" rx="12" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="380" y="222" fill="#38bdf8">JPA</text>

      <rect x="416" y="206" width="70" height="24" rx="12" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="451" y="222" fill="#a78bfa">Flyway</text>

      <rect x="494" y="206" width="50" height="24" rx="12" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-opacity="0.6"/>
      <text x="519" y="222" fill="#e11d48">SQL</text>

      <rect x="552" y="206" width="72" height="24" rx="12" fill="#2496ed" fill-opacity="0.12" stroke="#2496ed" stroke-opacity="0.6"/>
      <text x="588" y="222" fill="#2496ed">Docker</text>

      <rect x="632" y="206" width="86" height="24" rx="12" fill="#8b98ad" fill-opacity="0.12" stroke="#8b98ad" stroke-opacity="0.6"/>
      <text x="675" y="222" fill="#8b98ad">CI/CD</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="259" rx="16" fill="none" stroke="#2a3a5e"/>
</svg>
