<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Manuel Ramos, Java Backend Developer">
  <title>Manuel Ramos - Java Backend Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#15234a"/>
    </linearGradient>
    <linearGradient id="name" x1="60" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f89820"/>
      <stop offset="0.5" stop-color="#6db33f"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f89820"/>
      <stop offset="0.5" stop-color="#6db33f"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="gO">
      <stop offset="0" stop-color="#f89820" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f89820" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gG">
      <stop offset="0" stop-color="#6db33f" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6db33f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gC">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="round">
      <rect width="900" height="280" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#dots)"/>

    <circle cx="770" cy="70" r="230" fill="url(#gO)"/>
    <circle cx="90" cy="300" r="230" fill="url(#gG)"/>
    <circle cx="860" cy="270" r="200" fill="url(#gC)"/>

    <g opacity="0.28" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="16">
      <text x="600" y="80" fill="#6db33f">@RestController</text>
      <text x="650" y="140" fill="#38bdf8">SELECT * FROM skills;</text>
      <text x="590" y="205" fill="#f89820">Thread.ofVirtual()</text>
      <text x="760" y="252" fill="#a78bfa">@Service</text>
    </g>

    <text x="60" y="78" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="16" fill="#6db33f">// hello, world</text>

    <text x="60" y="152" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-1" fill="url(#name)">Manuel Ramos</text>

    <text x="60" y="198" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="24" fill="#cbd5e1">Java Backend Developer</text>

    <g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" text-anchor="middle">
      <rect x="60" y="222" width="115" height="28" rx="14" fill="#6db33f" fill-opacity="0.12" stroke="#6db33f" stroke-opacity="0.6"/>
      <text x="117.5" y="240.5" fill="#6db33f">Spring Boot</text>

      <rect x="185" y="222" width="146" height="28" rx="14" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="258" y="240.5" fill="#34d399">Spring Security</text>

      <rect x="341" y="222" width="52" height="28" rx="14" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="367" y="240.5" fill="#38bdf8">SQL</text>

      <rect x="403" y="222" width="75" height="28" rx="14" fill="#2496ed" fill-opacity="0.12" stroke="#2496ed" stroke-opacity="0.6"/>
      <text x="440.5" y="240.5" fill="#2496ed">Docker</text>
    </g>

    <rect y="276" width="900" height="4" fill="url(#bar)"/>
  </g>

  <rect x="0.5" y="0.5" width="899" height="279" rx="18" fill="none" stroke="#2a3a5e"/>
</svg>
